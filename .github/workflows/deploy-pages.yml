name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          # Vite bakes these into the bundle at build time — without them here,
          # src/lib/supabase.ts falls back to a null client and the admin login
          # fails with "Supabase är inte konfigurerad." on the deployed site
          # even though a local .env works fine. Anon key is public by design.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # The two form webhooks. Unset secrets arrive as empty strings, which
          # contact-webhook.ts / catering-webhook.ts already treat as "not
          # configured" — so leaving these blank changes nothing and the forms
          # keep delivering to Supabase and /admin/forms as they do today.
          # They are listed here so that setting the secrets is all it takes:
          # without these lines a local .env would work and the deployed site
          # would silently have no webhook, which is a confusing way to find out.
          VITE_CONTACT_WEBHOOK_URL: ${{ secrets.VITE_CONTACT_WEBHOOK_URL }}
          VITE_CATERING_WEBHOOK_URL: ${{ secrets.VITE_CATERING_WEBHOOK_URL }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
